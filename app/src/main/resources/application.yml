spring:
  application:
    name: words
  config:
    # Local secrets: .env in the repository root (bootRun runs from app/, java -jar from the root).
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:words}
    username: ${DB_USER:words}
    password: ${DB_PASSWORD:words}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

words:
  limits:
    # New words per user per day (UTC), all languages together; 0 disables the limit.
    new-words-per-day: 20
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-5-5
    max-tokens: 4000
    timeout: 30s
    max-retries: 2

management:
  endpoints:
    web:
      exposure:
        include: health
